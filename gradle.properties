# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# The NeoForm/modding pipeline task is not configuration-cache compatible.
org.gradle.configuration-cache=false

# This network cannot reach maven.neoforged.net directly (TCP blocked), so all Gradle
# traffic is sent through the local Clash Verge mixed port. Change the port if yours differs,
# or delete these four lines on a machine with direct access.
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=7897
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7897

# Parchment (optional parameter names for development; remove the parchment block
# in build.gradle if the parchment maven is unreachable from your network)
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Minecraft / NeoForge
# The Minecraft version must agree with the Neo version to get a valid artifact
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
# If this exact NeoForge build fails to resolve, replace with any other 21.1.x build
# (the latest can be found at https://projects.neoforged.net/neoforged/neoforge)
neo_version=21.1.262
loader_version_range=[1,)

## Mod properties
mod_id=myriadbloom
mod_name=Myriad Bloom
mod_license=All Rights Reserved
mod_version=1.0.4beta
mod_group_id=com.myriadbloom
